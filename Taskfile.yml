version: '3'

tasks:
  backend:
    desc: "Start FastAPI backend"
    cmds:
      - uv run uvicorn app.main:app --reload

  frontend:
    desc: "Start Vite frontend"
    dir: frontend
    cmds:
      - npm run dev

  dev:
    desc: "Run backend and frontend in parallel"
    deps: [backend, frontend]

  test-backend:
    desc: "Run Python backend tests with coverage"
    cmds:
      - uv run pytest -vv --tb=short --durations=10 --cov=src/finder_citations --cov=app --cov-report=term-missing

  test-frontend:
    desc: "Run React frontend tests with coverage"
    dir: frontend
    cmds:
      - npm run test:coverage

  test:
    desc: "Run all tests sequentially"
    cmds:
      - task: test-backend
      - task: test-frontend

  docker-build:
    desc: "Build the Docker image locally"
    cmds:
      - docker build -t mdc-service:local .

  docker-run:
    desc: "Run the local Docker image"
    deps: [docker-build]
    cmds:
      - docker run -p 8000:8000 --env-file .env mdc-service:local

  download-data:
    desc: "Download competition data from Kaggle"
    cmds:
      - mkdir -p data
      - uv run kaggle competitions download -c make-data-count-finding-data-references -p data/
      - uv run python -m zipfile -e data/make-data-count-finding-data-references.zip data/
      - rm data/make-data-count-finding-data-references.zip
    status:
      - test -d data/train/PDF
