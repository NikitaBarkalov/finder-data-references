name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      tests_trigger: ${{ steps.filter.outputs.tests_trigger }}
      deploy_trigger: ${{ steps.filter.outputs.deploy_trigger }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tests_trigger:
              - "app/**"
              - "src/**"
              - "frontend/**"
              - "tests/**"
              - "pyproject.toml"
              - "uv.lock"
              - "Dockerfile"
              - ".github/workflows/ci.yml"
            deploy_trigger:
              - "app/**"
              - "src/**"
              - "frontend/**"
              - "pyproject.toml"
              - "uv.lock"
              - "Dockerfile"
              - ".github/workflows/ci.yml"

  backend_tests:
    needs: changes
    if: ${{ needs.changes.outputs.tests_trigger == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Create frontend asset stub
        run: mkdir -p frontend/dist/assets

      - name: Install backend dependencies
        run: uv sync --frozen --group dev

      - name: Run backend test suite
        run: uv run pytest -q --cov=finder_citations --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

  frontend_tests:
    needs: changes
    if: ${{ needs.changes.outputs.tests_trigger == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend format check
        working-directory: ./frontend
        run: npm run format:check

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:coverage

  deploy:
    needs: [changes, backend_tests, frontend_tests]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy_trigger == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        id: repo
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.repo_lc }}/mdc-service:latest

      - name: Trigger and Wait for Render Deploy
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true
