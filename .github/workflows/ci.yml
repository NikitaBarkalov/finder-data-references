name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      tests_trigger: ${{ steps.filter.outputs.tests_trigger }}
      deploy_trigger: ${{ steps.filter.outputs.deploy_trigger }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get base commit
        id: get_base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
          else
            LAST_SHA=$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha' || echo "")
            if [ -z "$LAST_SHA" ] || [ "$LAST_SHA" == "null" ]; then
              LAST_SHA=${{ github.event.before || github.sha }}
            fi
            echo "base_sha=$LAST_SHA" >> $GITHUB_OUTPUT
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.get_base.outputs.base_sha }}
          filters: |
            tests_trigger:
              - "app/**"
              - "src/**"
              - "frontend/**"
              - "tests/**"
              - "pyproject.toml"
              - "uv.lock"
              - "Dockerfile"
              - ".github/workflows/ci.yml"
            deploy_trigger:
              - "app/**"
              - "src/**"
              - "frontend/**"
              - "pyproject.toml"
              - "uv.lock"
              - "Dockerfile"
              - ".github/workflows/ci.yml"

  backend_tests:
    needs: changes
    if: ${{ needs.changes.outputs.tests_trigger == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Create frontend asset stub
        run: mkdir -p frontend/dist/assets

      - name: Install backend dependencies
        run: uv sync --frozen --group dev

      - name: Run backend test suite
        run: uv run pytest -q --cov=finder_citations --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

  frontend_tests:
    needs: changes
    if: ${{ needs.changes.outputs.tests_trigger == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend format check
        working-directory: ./frontend
        run: npm run format:check

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:coverage

  deploy:
    needs: [changes, backend_tests, frontend_tests]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy_trigger == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        id: repo
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.repo_lc }}/mdc-service:latest

      - name: Trigger, Wait and Verify Render Deploy
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Triggering deploy..."
          DEPLOY_RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")
          
          DEPLOY_ID=$(echo "$DEPLOY_RESPONSE" | jq -r '.id')
          
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" == "null" ]; then
            echo "Failed to trigger deploy. Response:"
            echo "$DEPLOY_RESPONSE"
            exit 1
          fi
          
          echo "Deploy triggered with ID: $DEPLOY_ID"
          echo "Waiting for deploy to finish..."
          
          while true; do
            STATUS=$(curl -s -X GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" | jq -r '.status')
              
            echo "Current status: $STATUS"
            
            if [ "$STATUS" == "live" ]; then
              echo "Deploy successful!"
              echo "--- Fetching Startup Logs ---"
              SERVICE_RESPONSE=$(curl -s -X GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID" -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json")
              SERVICE_URL=$(echo "$SERVICE_RESPONSE" | jq -r '.serviceDetails.url')
              
              if [ -z "$SERVICE_URL" ] || [ "$SERVICE_URL" == "null" ]; then
                echo "Could not resolve service URL"
                exit 1
              fi
              
              sleep 5
              
              LOGS_OUTPUT=$(curl -s "$SERVICE_URL/api/v1/startup-logs" | jq -r '.logs[]?')
              echo "$LOGS_OUTPUT"
              echo "-----------------------------"
              
              MISSING_LOGS=0
              
              if ! echo "$LOGS_OUTPUT" | grep -q "CLOUD/GROQ"; then
                echo "Error: Expected log containing 'CLOUD/GROQ' not found."
                MISSING_LOGS=1
              fi
              
              if ! echo "$LOGS_OUTPUT" | grep -q "Article prefixes loaded"; then
                echo "Error: Expected log containing 'Article prefixes loaded' not found."
                MISSING_LOGS=1
              fi
              
              if ! echo "$LOGS_OUTPUT" | grep -q "author extraction enabled"; then
                echo "Error: Expected log containing 'author extraction enabled' not found."
                MISSING_LOGS=1
              fi
              
              if [ "$MISSING_LOGS" -eq 1 ]; then
                echo "Startup logs verification failed!"
                exit 1
              else
                echo "All startup logs verified successfully."
                exit 0
              fi
            elif [[ "$STATUS" == "build_failed" || "$STATUS" == "canceled" || "$STATUS" == "deactivated" ]]; then
              echo "Deploy failed with status: $STATUS"
              exit 1
            fi
            
            sleep 15
          done
