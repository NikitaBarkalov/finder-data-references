name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "frontend/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "frontend/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Create frontend asset stub
        run: mkdir -p frontend/dist/assets

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run test suite
        run: uv run pytest -q --cov=finder_citations --cov=app --cov-report=term-missing --cov-fail-under=80
