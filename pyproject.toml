[project]
name = "finder_citations"
version = "0.1.0"
description = "Make Data Count - Finding Data References project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pymupdf",
    "spacy",
    "requests",
    "pandas",
    "numpy",
    "tqdm",
    "pdfminer.six",
    "aiohttp",
    "python-multipart",
    "python-dotenv",
    "openai",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
