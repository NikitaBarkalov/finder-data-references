[project]
name = "mdc_extractor"
version = "0.1.0"
description = "Make Data Count - Finding Data References project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pymupdf",
    "spacy",
    "requests",
    "transformers",
    "torch",
    "pandas",
    "numpy",
    "ray",
    "tqdm",
    "pdfminer.six",
    "aiohttp",
    "python-multipart",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
