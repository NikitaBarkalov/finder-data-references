[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "finder_citations"
version = "0.1.0"
description = "Make Data Count - Finding Data References project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pymupdf",
    "spacy",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "requests",
    "pandas",
    "numpy",
    "tqdm",
    "pdfminer.six",
    "aiohttp",
    "python-multipart",
    "python-dotenv",
    "openai",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "httpx",
    "pytest-cov",
    "ruff",
    "pre-commit>=4.6.1",
    "go-task-bin>=3.52.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*httpx2.*",
    "ignore:.*starlette.*",
]

[tool.pyright]
extraPaths = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "*.ipynb",
    "notebooks/*",
    "scratch_notebook.py",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "ERA", # eradicate (forbids commented out code)
    "FIX", # flake8-fixme (forbids TODO, FIXME)
]
ignore = [
    "E501", # Line too long (prevents linter from complaining about long prompts)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Form", "fastapi.File", "Depends", "Query", "Path", "Body", "Form", "File"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
