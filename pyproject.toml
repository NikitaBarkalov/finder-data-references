[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "finder_citations"
version = "0.1.0"
description = "Make Data Count - Finding Data References project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pymupdf",
    "spacy",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "requests",
    "pandas",
    "numpy",
    "tqdm",
    "pdfminer.six",
    "aiohttp",
    "python-multipart",
    "python-dotenv",
    "openai",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "httpx",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["."]
