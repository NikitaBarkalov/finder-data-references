services:
  vllm:
    image: vllm/vllm-openai:v0.24.0
    container_name: vllm_local
    ports:
      - "8080:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_WEIGHT_OFFLOADING_DISABLE_UVA=1
      - VLLM_USE_V2_MODEL_RUNNER=0
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    command: >
      --model ${LLM_MODEL_NAME} --max-model-len ${VLLM_MAX_MODEL_LEN} --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION} --enforce-eager --generation-config vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
